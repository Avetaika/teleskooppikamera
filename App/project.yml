# XcodeGen spec for the iOS app. The .xcodeproj is generated (CI: `xcodegen generate --spec App/project.yml`)
# and is not committed. See decisions.md D-02. All paths are relative to this file (App/).
name: Teleskooppikamera

options:
  bundleIdPrefix: fi.avetaika
  developmentLanguage: fi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1" # CI overrides this with the workflow run number
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only (D-16)
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  TeleskooppiCore:
    path: ../Core

targets:
  Teleskooppikamera:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: TeleskooppiCore
        product: TeleskooppiCore
    info:
      path: Info.plist # generated by XcodeGen, not committed (see App/.gitignore)
      properties:
        CFBundleDisplayName: Teleskooppi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fi
        NSCameraUsageDescription: Kameraa käytetään kaukoputken okulaarikuvan näyttämiseen ja kameran ominaisuuksien mittaamiseen.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait only: the UI must not rotate with the phone on the eyepiece (D-13).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: Teleskooppikamera
        PRODUCT_BUNDLE_IDENTIFIER: fi.avetaika.teleskooppikamera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AppTests
      gatherCoverageData: false

  AppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: Teleskooppikamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.avetaika.teleskooppikamera.tests
